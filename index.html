<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="loader" class="loader">
      <div class="spinner"></div>
    </div>
    <div class="quote-container" id="quote-container">
      <!-- Quote will be displayed here -->
      <div class="quote-text">
        <i class="fas fa-quote-left"></i>
        <span id="quote" class="quote">Quote goes here</span>
      </div>
      <!-- Author will be displayed here -->
      <div class="quote-author">
        <span id="author">Author goes here</span>
      </div>
      <!-- Buttons will be displayed here -->
      <div class="button-container">
        <button class="twitter-button" id="twitter" title="Tweet This!">
          <i class="fab fa-twitter"></i>
        </button>
        <button class="new-quote" id="new-quote">New Quote</button>
      </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
